name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 本项目是 Windows 桌面应用，核心逻辑大量依赖 Windows 路径/命令语义，
    # 因此 CI 与产品运行环境保持一致，使用 windows-latest。
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Run tests
        # 冒烟 + 核心逻辑单测 + 确认令牌回归；
        # test_assertions/test_orchestrator 为真实 Agent 执行器，依赖本地 LLM 与完整依赖，不纳入 CI。
        run: python -m pytest tests/test_smoke.py tests/test_core tests/test_confirmation_manager.py -q
