# ═══════════════════════════════════════════════════
# 安全规则配置 — 唯一数据源
# 修改此文件后约 2 秒内自动生效，无需重启服务
# ═══════════════════════════════════════════════════

# ── safe_exec: 路径硬拦截（L0） ──
safe_exec:
  # 删除类命令识别
  delete_command_patterns:
    - \bdel\b
    - \brmdir\b
    - \brd\b
    - \bRemove-Item\b
    - \brm\b
    - \brmtree\b
    - \bshutil\.rmtree
    - \bClear-RecycleBin\b

  # 受保护路径模式：命中任一即拒绝执行
  protected_path_patterns:
    # 系统核心目录
    - pattern: "(?i)[A-Z]:\\Windows\\"
      desc: "Windows 系统目录"
    - pattern: "(?i)[A-Z]:\\Program Files\\"
      desc: "Program Files 目录"
    - pattern: "(?i)[A-Z]:\\Program Files \\(x86\\)\\"
      desc: "Program Files (x86) 目录"
    - pattern: "(?i)[A-Z]:\\ProgramData\\"
      desc: "ProgramData 目录"
    # 聊天记录数据库
    - pattern: "(?i)WeChat Files\\.+?\\Msg[\\\\.]"
      desc: "微信聊天记录数据库"
    - pattern: "(?i)Tencent Files\\.+?\\Msg[0-9]"
      desc: "QQ 聊天记录数据库"
    - pattern: "(?i)DingTalk\\.+?\\db[\\\\.]"
      desc: "钉钉聊天记录数据库"
    # 安全凭据
    - pattern: "(?i)\\\\.ssh\\"
      desc: "SSH 密钥目录"
    - pattern: "(?i)\\\\.aws\\"
      desc: "AWS 凭据目录"
    - pattern: "(?i)\\\\.kube\\"
      desc: "Kubernetes 配置目录"
    - pattern: "(?i)\\\\.env$"
      desc: "环境变量配置文件"
    - pattern: "(?i)\\\\.git\\"
      desc: "Git 仓库数据"

  # 挑战短语
  danger_challenge_phrase: "我知晓此操作为危险操作，我确认授权给Agent执行此危险操作"

  # 危险模式定义（仅保留高风险操作；taskkill 等已由 execute_command 确认层处理）
  danger_patterns:
    - pattern: \breg\s+add\b.*\bHKLM\b
      desc: "写入系统级注册表 (HKLM)"
      level: challenge
    - pattern: \breg\s+add\b.*\bHKEY_LOCAL_MACHINE\b
      desc: "写入系统级注册表 (HKLM)"
      level: challenge

  # 这些模式始终拦截，不进入确认流程（Layer 1 硬拦截）
  always_blocked:
    - \bformat\s+\w:\b
    - \bformat\b
    - \bdel\b
    - \bdel\s+/[fF]\s+/[sS]
    - \brm\b
    - \brm\s+-rf\s+/
    - \brmdir\b
    - \brmdir\s+/[sS]\s+C:\\
    - \brmtree\b
    - \bshutil\.rmtree
    - \bRemove-Item\b
    - \bRemove-Item\b.*-Recurse
    - \breg\s+delete\b
    - \breg\s+delete\s+.*HKLM\b
    - \breg\s+delete\s+.*HKEY_LOCAL_MACHINE\b
    - \bClear-RecycleBin\b
    - \bdiskpart\s+clean\b
    - \bshutdown\s+/[sSrR]\s+/t\s+0\b
    - \bStop-Computer\b
    - \bRestart-Computer\b

# ── file_tools: 文件操作安全集合 ──
file_tools:
  # 扫描时跳过目录
  skip_dirs:
    - Windows
    - Program Files
    - Program Files (x86)
    - ProgramData
    - $RECYCLE.BIN
    - System Volume Information
    - Recovery
    - node_modules
    - __pycache__
    - .git
    - .vscode
    - .idea
    - AppData
    - Local Settings
    - Application Data
    - Temp

  # 强制禁止模式
  forbidden_patterns:
    - "rm -rf /"
    - "del /f /s"
    - "format "
    - shutdown

  # 注册表写入命令（已废弃，注册表操作统一走确认弹窗）
  registry_write_commands: []

  # 免确认程序列表（读操作 / 低风险工具）
  skip_confirm_programs:
    - dir
    - copy
    - move
    - mkdir
    - echo
    - type
    - findstr
    - where
    - python
    - git
    - node
    - npx
    - yarn
    - systeminfo
    - wmic
    - tasklist
    - Get-ItemProperty
    - Get-ChildItem
    - Get-Process
    - Get-Service
    - Get-WmiObject
    - Get-CimInstance
    - Get-Content

  # 只读命令/PowerShell cmdlet 集合：不触发确认，直接执行
  readonly_patterns:
    # 应用启动（只读打开，无副作用）
    apps:
      - explorer
      - notepad
      - calc
      - mspaint
      - charmap
    # PowerShell 查询 cmdlet
    ps_cmdlets:
      - get-childitem
      - get-itemproperty
      - get-process
      - get-service
      - get-content
      - get-wmiobject
      - get-ciminstance
      - get-item
      - get-date
      - get-location
      - get-history
      - get-command
      - get-module
      - get-variable
      - get-alias
      - get-psdrive
      - get-psprovider
      - get-host
      - get-culture
      - get-uiculture
    # CMD 查询 / 输出命令
    cmd_queries:
      - dir
      - cat
      - type
      - echo
      - where
      - findstr
      - select-string
      - write-host
      - write-output
    # 系统信息查询
    sys_info:
      - whoami
      - hostname
      - systeminfo
      - tasklist
      - net
      - ipconfig
      - ping
      - tracert
      - nslookup
    # 文件比较 / 校验
    file_compare:
      - fc
      - comp
      - certutil
    # 其他
    other:
      - wmic

  # 低风险注册表操作关键词：用户偏好类（桌面图标/任务栏/资源管理器外观）直接放行
  low_risk_registry_patterns:
    # 桌面图标显隐（纯UI偏好）
    - HideDesktopIcons
    - ShowDesktopIcons
    # 任务栏设置
    - ShowSecondsInSystemClock
    - TaskbarSi
    - TaskbarDa
    - TaskbarGlomLevel
    - EnableAutoTray
    # 文件资源管理器偏好
    - ShowStatusBar
    - ShowPreviewHandlers
    - Hidden
    - HideFileExt
    - ShowSuperHidden
    # 开始菜单/搜索
    - Start_Show
    - DisableSearchBoxSuggestions

  # 命令反模式
  command_anti_patterns:
    - pattern: "dir\\s+\\S+\\s+/[sb].*\\|.*findstr"
      message: "dir /s /b 只输出文件名（不含大小/日期/权限）。如果要按文件属性（大小/日期/内容等）过滤，dir 做不到。请改用 python os.walk + 条件判断，在扫描时直接过滤。"
    - pattern: "dir\\s+\\S+\\s+/[sb].*\\s*>\\s*\\S+[Tt]emp"
      message: "dir 递归全量输出并重定向到临时文件可能极其缓慢。如果最终目标是过滤，请在源头用 python os.walk 加条件判断，不要先生成全量列表再过滤。"

# ── search_tools: 搜索工具安全集合 ──
search_tools:
  # 扫描时跳过目录（与 file_tools 共用，此处独立维护以支持差异化）
  skip_dirs:
    - Windows
    - Program Files
    - Program Files (x86)
    - ProgramData
    - $RECYCLE.BIN
    - System Volume Information
    - Recovery
    - node_modules
    - __pycache__
    - .git
    - .vscode
    - .idea
    - AppData
    - Local Settings
    - Application Data
    - Temp

  # 可下载扩展名（web_search 结果自动识别）
  downloadable_exts:
    - .pdf
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .zip
    - .mp4
    - .mp3
    - .docx
    - .xlsx
    - .pptx

# ── registry_tools: 注册表操作白名单 ──
registry_tools:
  allowed_root_keys:
    - HKCU
    - HKEY_CURRENT_USER

  allowed_path_prefixes:
    - Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    - Software\Microsoft\Windows\CurrentVersion\Explorer
    - Control Panel\Desktop
    - Control Panel\International
    - Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
    - Software\Microsoft\Windows\CurrentVersion\Explorer\Accent

  allowed_operations:
    - query
    - add

  forbidden_values:
    - disableregistrytools
    - notaskmgr
    - norun
    - noclose
    - disablecmd
    - disabletaskmgr
    - nofolderoptions
    - disablechangepassword
    - nolock
    - disableremote

  forbidden_operations:
    - delete
    - import
    - export
    - save
    - restore
    - copy
    - load
    - unload
    - compare
    - flags

# ── web_download: 下载安全扩展名 ──
web_download:
  # 需用户确认的可执行扩展名
  risky_extensions:
    - .exe
    - .msi
    - .bat
    - .cmd
    - .com
    - .scr
    - .ps1
    - .vbs
    - .dll
    - .sys
    - .reg
