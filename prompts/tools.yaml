# ============================================================
# smartDesktop 工具声明式配置 - 唯一真相源
# ============================================================
# 注入策略说明：
#   always_inject: 每轮对话始终可用的基础工具（无需加载域）
#   domains[].tools: 需先调用 load_domain_skills 加载对应域后才可用
#   若工具同时出现在两处，以 always_inject 为准（始终可用）
# tier 说明: 1=基础高频  2=进阶  3=复杂/低频
# personas: 仅用于角色模式关键词触发（match_persona），与 tools/domains 独立；
#   如需角色绑定工具域，应在外部维护 persona → domains 映射

always_inject:
  - read_file
  - scan_directory
  - search_files
  - search_content
  - replace_in_file
  - ask_user_clarification
  - get_workspace_path
  - copy_file_to_workspace
  - load_domain_skills
  - execute_command

tools:
  read_file:
    desc: 读取文件内容（可指定行范围），1-based
    params:
      file_path: {type: str, desc: 绝对路径}
      start_line: {type: int, optional: true, desc: 起始行}
      end_line: {type: int, optional: true, desc: 结束行}
    note: 大文件可分页读取
    tier: 1
    tags: [filesystem, general]

  scan_directory:
    desc: 扫描目录第一层，返回 JSON 数组 [path必须已存在]
    note: |
      适用场景：
      - 需要了解某个目录下有哪些文件/子目录（仅第一层，不递归）
      - 需要确认某个目录是否存在、是否为空
      - 需要把用户提到的文件名映射到真实绝对路径时，先扫其所在目录定位
      不适用场景（请改用更合适的工具）：
      - 需要递归/深层搜索文件 → 用 search_files（可按文件名关键词、扩展名过滤）
      - 需要按文件内容搜索 → 用 search_content
      - 需要读取文件内容 → 用 read_file
      - 需要新建/修改/删除文件 → 用对应的文件操作工具，不要用 scan_directory
    params:
      path: {type: str, desc: 要扫描的目录绝对路径}
    tier: 1
    tags: [filesystem, general]

  search_files:
    desc: 按文件名关键词递归搜索文件（默认优先项目根与工作区，深度放宽到10层；兜底用户目录及D/E/F盘仅3层）
    params:
      keyword: {type: str, desc: 文件名关键词}
      search_path: {type: str, optional: true, desc: 搜索起始路径，默认项目根+工作区+用户目录及D/E/F盘}
      file_extensions: {type: list, optional: true, desc: '扩展名过滤如[".pdf"]'}
    note: max_results=5
    tier: 1
    tags: [filesystem, search, general]

  search_content:
    desc: 按内容搜索代码文件，返回文件:行号
    params:
      keyword: {type: str, desc: 搜索关键词}
      directory: {type: str, optional: true, desc: 搜索路径}
      file_pattern: {type: str, optional: true, desc: 文件通配符如"*.py"}
      max_results: {type: int, optional: true, desc: 最大结果数}
    tier: 1
    tags: [code, search, general]

  get_workspace_path:
    desc: 返回项目工作空间绝对路径
    note: 无参数
    tier: 1
    tags: [utility, general]

  get_project_summary:
    desc: 返回项目结构概览（子目录+关键文件列表）
    params:
      directory: {type: str, optional: true, desc: 目录路径，默认为工作空间}
    tier: 1
    tags: [utility, project, general]

  replace_in_file:
    desc: 精确字符串替换，修改已有文件
    params:
      file_path: {type: str, desc: 文件绝对路径}
      old_str: {type: str, desc: 要替换的原文本}
      new_str: {type: str, desc: 新文本}
      occurrence: {type: int, optional: true, default: 1, desc: "替换第几次出现(1-based)；old_str 出现多次时只替换第 N 处，其余保留"}
    note: 只替换第 occurrence 次出现；若 old_str 出现 0 次或次数少于 occurrence，工具会报错而非静默替换，请先用 search_content 确认出现次数
    tier: 1
    tags: [code, edit, general]

  ask_user_clarification:
    desc: 向用户提问获取更多信息或确认操作
    params:
      question: {type: str, desc: 要问用户的问题}
      options: {type: list, optional: true, desc: 可选答案列表}
    tier: 1
    tags: [utility, clarification]

  load_domain_skills:
    desc: 当用户需求超出基础文件读写/搜索能力时，加载指定的进阶技能域。加载成功后，下一轮对话你将获得该域的全部新工具。
    params:
      domain: {type: str, enum: ["code_dev", "web_browse", "system_basic", "system_high_risk", "excel_analyze", "office_word", "office_ppt", "gui_automation","user_memory","db_query"], desc: "技能域名称。选择最匹配用户当前需求的一个。"}
      reason: {type: str, desc: "简要说明加载原因"}
      session_id: {type: str, optional: true, desc: "会话ID，用于跟踪已加载的域"}
    tier: 1
    tags: [utility, skill_loader]

  copy_file_to_workspace:
    desc: 将外部文件（如桌面、下载文件夹）复制到工作区，以便后续操作
    params:
      source_path: {type: str, desc: 源文件绝对路径（如 <用户目录>\Desktop\file.xlsx）}
      dest_filename: {type: str, optional: true, desc: 目标文件名（可选，默认使用源文件名）}
    tier: 1
    tags: [filesystem, copy, workspace]

# ==================== GUI自动化工具 ====================
  gui_click:
    desc: 在屏幕指定坐标执行鼠标点击
    precondition: 坐标必须来自 gui_screenshot 或 gui_locate_image 的返回结果，禁止凭空猜测坐标
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置），用于确认点击是否生效
    params:
      x: {type: int, desc: "屏幕X坐标(像素)，须≥0且<屏幕宽度"}
      y: {type: int, desc: "屏幕Y坐标(像素)，须≥0且<屏幕高度"}
      button: {type: str, optional: true, desc: "鼠标按钮", default: "left", enum: [left, right, middle]}
      clicks: {type: int, optional: true, desc: "点击次数", default: 1, enum: [1, 2]}
    tier: 2
    tags: [gui, mouse, automation]
    domains: [gui_automation]

  gui_move:
    desc: 移动鼠标到指定位置（不点击）
    precondition: 坐标必须来自 gui_screenshot 或 gui_locate_image 的返回结果，禁止凭空猜测坐标
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置）
    params:
      x: {type: int, desc: "目标X坐标(像素)"}
      y: {type: int, desc: "目标Y坐标(像素)"}
      duration: {type: float, optional: true, desc: "移动持续时间(秒)，与 gui_tools.gui_move 实现默认值一致", default: 0.3}
    tier: 2
    tags: [gui, mouse, automation]
    domains: [gui_automation]

  gui_type:
    desc: 模拟键盘输入文本到当前焦点窗口
    precondition: 输入前先确认目标输入框已聚焦（可用 gui_click 点击目标区域或 gui_activate 激活窗口）
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置）
    params:
      text: {type: str, desc: "要输入的文本"}
      interval: {type: float, optional: true, desc: "字符间延迟(秒)", default: 0.1}
    tier: 2
    tags: [gui, keyboard, automation]
    domains: [gui_automation]

  gui_keys:
    desc: 按下键盘按键（组合键/功能键）
    precondition: 使用前确认目标窗口已激活（可用 gui_activate 激活）
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置）
    params:
      keys: {type: list, desc: "按键列表，如['ctrl', 'c']或['enter']"}
    tier: 2
    tags: [gui, keyboard, automation]
    domains: [gui_automation]

  gui_active_window:
    desc: 获取当前活动窗口信息
    returns: 返回当前活动窗口的标题、类名、位置等信息，用于确认当前焦点窗口
    tier: 2
    tags: [gui, window, info]
    domains: [gui_automation]

  gui_find_window:
    desc: 根据标题关键词查找窗口
    returns: 返回匹配窗口的句柄、标题、位置等信息；未找到时返回空结果
    params:
      title_keyword: {type: str, desc: "窗口标题关键词"}
    tier: 2
    tags: [gui, window, search]
    domains: [gui_automation]

  gui_activate:
    desc: 激活指定窗口（将窗口带到前台并获得焦点）
    precondition: 目标窗口需已存在（可用 gui_find_window 或 gui_active_window 确认）
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置）
    params:
      title_keyword: {type: str, desc: "窗口标题关键词"}
    tier: 2
    tags: [gui, window, control]
    domains: [gui_automation]

  gui_screenshot:
    desc: 屏幕截图（全屏或指定区域）
    returns: 返回截图保存路径；截图用于获取界面坐标、确认界面状态
    params:
      region_x: {type: int, optional: true, desc: "截图区域X坐标"}
      region_y: {type: int, optional: true, desc: "截图区域Y坐标"}
      region_w: {type: int, optional: true, desc: "截图区域宽度"}
      region_h: {type: int, optional: true, desc: "截图区域高度"}
      save_path: {type: str, optional: true, desc: "保存路径，默认自动生成"}
    tier: 2
    tags: [gui, screen, capture]
    domains: [gui_automation]

  gui_locate_image:
    desc: 在屏幕上定位模板图像，返回其中心坐标
    precondition: 模板图像需预先存在（可用 gui_screenshot 截取目标区域保存为模板）
    returns: 返回匹配到的中心坐标(x,y)及置信度；未匹配到时返回失败
    params:
      image_path: {type: str, desc: "模板图像路径"}
      confidence: {type: float, optional: true, desc: "匹配置信度(0-1)", default: 0.8}
    tier: 2
    tags: [gui, image, recognition]
    domains: [gui_automation]

  gui_open_app:
    desc: 打开应用程序（exe 或系统应用）
    returns: 返回 success/message，并附带 environment（当前活动窗口标题+鼠标位置）
    params:
      application_path: {type: str, desc: "应用程序路径"}
      wait_time: {type: int, optional: true, desc: "等待应用程序启动时间(秒)", default: 3}
    tier: 2
    tags: [gui, application, launcher]
    domains: [gui_automation]

  gui_workflow:
    desc: 按顺序执行多步GUI自动化，任一步失败则中止并返回断点环境
    precondition: 各步骤中的坐标必须来自 gui_screenshot 或 gui_locate_image 的返回结果，禁止凭空猜测
    returns: 成功返回全部 results（每步 result 列表）；失败返回 failed_step + current_environment，可据此修正后重试
    params:
      steps:
        type: list
        desc: |
          步骤对象数组，每项 {action, params}。action 可选:
          click({x,y,button?,clicks?}) / type({text}) / press_keys({keys}) /
          move_mouse({x,y}) / wait({seconds}) / screenshot({save_path?})
          示例: [{"action":"click","params":{"x":100,"y":200}}, {"action":"type","params":{"text":"hello"}}]
    tier: 3
    tags: [gui, automation, workflow]
    domains: [gui_automation]

  # 已废弃，使用 gui_screenshot 替代
  take_screenshot:
    desc: "【已废弃】请改用 gui_screenshot。截取屏幕并保存为 PNG 文件。"
    deprecated: true
    replaced_by: gui_screenshot
    inject: false   # 明确不再注入，仅在历史会话兼容时存在
    params:
      left: {type: int, optional: true, desc: 区域左边界像素}
      top: {type: int, optional: true, desc: 区域上边界像素}
      right: {type: int, optional: true, desc: 区域右边界像素}
      bottom: {type: int, optional: true, desc: 区域下边界像素}
      save_path: {type: str, optional: true, desc: 保存路径，默认自动生成}
    note: 此工具已废弃，请使用 gui_screenshot 替代。
    tier: 1
    tags: [screen, screenshot, deprecated]
    domains: []

  write_file:
    desc: 写入文件，自动建父目录；文件已存在且 overwrite=true（默认）时直接覆盖，overwrite=false 且文件已存在时报错不写入
    params:
      file_path: {type: str, desc: 文件绝对路径}
      content: {type: str, desc: 文件内容}
      overwrite: {type: bool, optional: true, default: true, desc: 是否覆盖已存在文件}
    tier: 2
    tags: [filesystem, general]
    domains: [code_dev]

  run_python:
    desc: 在受限沙箱中执行 Python（数据分析/图表/文件遍历）。库：pandas/openpyxl/matplotlib/xlsxwriter。禁止 input()/网络/系统命令/动态导入；文件读写仅限工作目录；超时默认 30s
    params:
      code: {type: str, desc: 完整Python代码，用print()输出}
      timeout: {type: int, optional: true, default: 30, desc: 执行超时秒数（与实现默认一致）}
    tier: 2
    tags: [code, general]
    domains: [code_dev, excel_analyze]

  execute_command:
    desc: 执行 PowerShell（文件/进程/注册表查询/网络/安装）。免确认：dir/copy/python/reg query 等只读操作。注：音量/音频命令自动路由到 system_audio 执行。通用兜底工具：同一目标存在专用工具（如 extract_word_text/create_word_document/excel_analyze 域工具等）时，必须先尝试专用工具，仅当专用工具无法满足需求时才使用本工具，且须在 reasoning_trace 说明专用工具无法满足的原因
    params:
      command: {type: str, desc: 要执行的PowerShell命令字符串}
    note: 禁止 rm -rf/format/shutdown；C 盘文件删除操作一律拒绝。删除分级：临时文件夹免确认、非 C 盘单文件删除 P2 普通确认、非 C 盘批量删除 P1 挑战确认、Program Files / Program Files (x86)（任意盘符，含 %ProgramFiles% 展开）批量删除 P0 拒绝。卸载分级：C 盘内软件 P1 挑战确认、非 C 盘软件 P2 普通确认（卸载不受 Program Files 批量删除检查影响）。注册表写分级：HKCU 用户级写 P1 挑战确认、HKLM/HKCR/HKU/HKCC 等全局根键写 P0 拒绝。音量/静音/麦克风类命令自动重定向到 system_audio 免确认执行。超时30s
    tier: 2
    tags: [shell, system, general]
    domains: [system_high_risk]

  get_uninstall_string:
    desc: 获取软件的卸载命令路径。卸载软件时必须首先调用此工具获取卸载程序路径，返回 DisplayName、UninstallString、InstallLocation 等信息，避免手动查询注册表。获取到卸载路径后，必须调用 execute_command 工具执行卸载程序
    params:
      program_name: {type: str, desc: 软件名称，支持模糊匹配，如"迅雷"、"Thunder"}
    tier: 1
    tags: [system, uninstall, software]
    domains: [system_high_risk]

  modify_registry:
    desc: 注册表修改（仅 HKCU）。桌面图标/任务栏/主题等视觉设置
    note: add 前自动验证目标键是否存在
    tier: 2
    tags: [system, config, registry]
    domains: [system_high_risk]

  verify_uninstall:
    desc: 验证软件是否已卸载成功（卸载后调用）。按软件名称模糊匹配注册表，返回残留注册表项/安装目录
    precondition: 须先调用 get_uninstall_string 获取卸载路径并执行卸载后，再调用本工具验证
    returns: 返回 JSON：remaining_entries（残留注册表项）、remaining_files（残留安装目录）、uninstalled（是否彻底卸载）
    params:
      program_name: {type: str, desc: 软件名称，支持模糊匹配}
      registry_path: {type: str, optional: true, desc: 可选的注册表路径，用于精确验证}
    tier: 1
    tags: [system, uninstall, verify]
    domains: [system_high_risk]

  web_search:
    desc: 网页搜索，返回标题+链接+摘要列表
    params:
      query: {type: str, desc: 搜索关键词}
    tier: 2
    tags: [web, search]
    domains: [web_browse]

  fetch_webpage:
    desc: 抓取网页正文。render_js=True 使用无头浏览器渲染 JS 页面（Vue/React/SPA），并自动提取下载链接（.exe/.msi 等）。支持批量抓取（urls 为数组时）。
    params:
      url: {type: str, optional: true, desc: 网页URL}
      urls: {type: list, optional: true, desc: URL列表（批量抓取）}
      render_js: {type: bool, optional: true, desc: 是否用浏览器渲染JS页面(默认false)}
    tier: 2
    tags: [web, scrape]
    domains: [web_browse]

  get_weather:
    desc: 查询天气，默认深圳
    params:
      city: {type: str, optional: true, default: 深圳, desc: 城市名}
    tier: 2
    tags: [web, weather]
    domains: [web_browse]

  web_download:
    desc: 从 URL 下载任意类型文件到本地。可执行文件（.exe/.msi 等）下载前会弹出风险确认卡片；其他类型直接下载。
    params:
      url: {type: str, desc: 文件直链}
      output_dir: {type: str, optional: true, desc: 默认用户Downloads}
    tier: 2
    tags: [web, download]
    domains: [web_browse, excel_analyze]

  system_audio:
    desc: 音频控制（音量/静音/麦克风/设备切换），value 0-100
    params:
      operation: {type: str, desc: "操作类型", enum: [get_volume, set_volume, toggle_mute, get_mic_volume, set_mic_volume, toggle_mic_mute, list_devices]}
      value: {type: int, optional: true, desc: 音量值 0-100}
      device: {type: str, optional: true, desc: 设备名关键词}
    note: 仅 set_volume/set_mic_volume 需要 value 参数
    tier: 2
    tags: [audio, volume, mute, mic, speaker, sound]
    domains: [system_basic]

  display_config:
    desc: 显示设置（分辨率/亮度/多显示器/缩放），AutoHotkey 封装
    params:
      operation: {type: str, desc: "操作类型", enum: [set_resolution, set_brightness, list_displays]}
      value: {type: str, optional: true, desc: '分辨率如"1920x1080"或亮度如"80"'}
    note: 依赖 AHK 脚本，仅 Windows
    tier: 2
    tags: [display, screen, monitor, resolution, brightness]
    domains: [system_basic]

  append_to_log:
    desc: 追加文本到日志文件
    params:
      file_path: {type: str, desc: 日志文件路径}
      content: {type: str, desc: 追加内容}
    tier: 2
    tags: [logging, utility]

  remember_user_info:
    desc: 持久化存储用户信息
    params:
      key: {type: str, desc: 信息键}
      value: {type: str, desc: 信息值}
    tier: 2
    tags: [memory, user]

# ==================== Excel 基础操作工具 ====================
  excel_read:
    desc: 读取Excel文件数据，返回JSON格式
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      sheet_name: {type: str, optional: true, desc: 工作表名，默认第一个}
      max_rows: {type: int, optional: true, default: 100, desc: 最大读取行数}
      start_row: {type: int, optional: true, default: 0, desc: 起始行}
    tier: 2
    tags: [excel, read, analysis]
    domains: [excel_analyze]

  excel_write:
    desc: 写入数据到Excel文件
    params:
      file_path: {type: str, desc: 文件保存绝对路径}
      data: {type: list, desc: 数据列表(字典或列表)}
      sheet_name: {type: str, optional: true, default: "Sheet1", desc: 工作表名}
      mode: {type: str, optional: true, default: "write", desc: "写入模式", enum: [write, append, new_sheet]}
    tier: 2
    tags: [excel, write, analysis]
    domains: [excel_analyze]

  excel_formula:
    desc: 对Excel单元格应用公式
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      sheet_name: {type: str, optional: true, desc: 工作表名}
      cell: {type: str, desc: 目标单元格如"A1"}
      formula: {type: str, desc: 公式如"=SUM(A2:A10)"}
    tier: 3
    tags: [excel, formula, calculation]
    domains: [excel_analyze]

  excel_merge:
    desc: 合并Excel单元格
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      sheet_name: {type: str, optional: true, desc: 工作表名}
      start_cell: {type: str, desc: 起始单元格如"A1"}
      end_cell: {type: str, desc: 结束单元格如"C3"}
    tier: 3
    tags: [excel, merge, formatting]
    domains: [excel_analyze]

  excel_convert:
    desc: 转换Excel文件格式（xlsx/xls/csv）
    params:
      file_path: {type: str, desc: 源文件绝对路径}
      output_format: {type: str, desc: "输出格式", enum: [xlsx, xls, csv]}
    tier: 3
    tags: [excel, convert, format]
    domains: [excel_analyze]

# ==================== Excel 高级处理工具 ====================
  excel_pivot:
    desc: 创建Excel透视表
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      index_cols: {type: list, desc: 行索引列名列表}
      value_cols: {type: list, desc: 数值列名列表}
      agg_func: {type: str, optional: true, default: sum, desc: "聚合函数", enum: [sum, mean, count]}
    tier: 3
    tags: [excel, pivot, analysis]
    domains: [excel_analyze]

  excel_format:
    desc: Excel格式化处理
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      sheet_name: {type: str, optional: true, desc: 工作表名，默认活动工作表}
      operations: {type: dict, optional: true, desc: 格式化操作配置}
    tier: 3
    tags: [excel, format, styling]
    domains: [excel_analyze]

  excel_conditional_format:
    desc: 设置Excel条件格式（单元格颜色/图标/数据条等）
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      sheet_name: {type: str, optional: true, desc: 工作表名}
      cell_range: {type: str, desc: 单元格范围如"A1:C10"}
      condition_type: {type: str, desc: "条件类型", enum: [cellIs, greaterThan, lessThan, between, containsText]}
      rule: {type: dict, desc: "条件规则如 {operator: greaterThan, value: 100}"}
      style: {type: dict, optional: true, desc: "样式配置如 {bg_color: 'FF0000'}"}
    tier: 3
    tags: [excel, conditional, formatting]
    domains: [excel_analyze]

  excel_chart_advanced:
    desc: 高级Excel图表生成
    params:
      file_path: {type: str, desc: Excel文件绝对路径}
      chart_config: {type: dict, desc: 图表配置字典(type/bar/line/pie, title等)}
    tier: 3
    tags: [excel, chart, visualization]
    domains: [excel_analyze]

  excel_batch_process:
    desc: 批量处理Excel文件
    params:
      directory: {type: str, desc: 文件夹绝对路径}
      operations: {type: list, desc: 操作列表}
    tier: 3
    tags: [excel, batch, processing]
    domains: [excel_analyze]

# ==================== Word 文档处理工具 ====================
  create_word_document:
    desc: 创建Word文档。内部已集成所有依赖，直接调用，禁止使用execute_command检查环境
    params:
      file_path: {type: str, desc: 文件保存绝对路径}
      content: {type: dict, optional: true, desc: 文档内容配置}
    tier: 3
    tags: [word, create, document]
    domains: [office_word]

  add_word_content:
    desc: 向Word文档添加内容。内部已集成所有依赖，直接调用，禁止使用execute_command检查环境
    params:
      file_path: {type: str, desc: 文档绝对路径}
      content_type: {type: str, desc: 内容类型(paragraph/table/heading/image)}
      content_config: {type: dict, desc: 内容配置}
    tier: 3
    tags: [word, content, edit]
    domains: [office_word]

  extract_word_text:
    desc: 提取Word文档文本内容。内部已集成所有依赖，直接调用，禁止使用execute_command检查环境
    params:
      file_path: {type: str, desc: 文档绝对路径}
      page_range: {type: tuple, optional: true, desc: 页码范围(起始,结束)}
    tier: 3
    tags: [word, extract, text]
    domains: [office_word]

  search_replace_word:
    desc: 在Word文档中查找替换文本。内部已集成所有依赖，直接调用，禁止使用execute_command检查环境
    params:
      file_path: {type: str, desc: 文档绝对路径}
      search_text: {type: str, desc: 查找文本}
      replace_text: {type: str, desc: 替换文本}
      case_sensitive: {type: bool, default: false, desc: 是否区分大小写}
    tier: 3
    tags: [word, search, replace]
    domains: [office_word]

  batch_word_process:
    desc: 批量处理Word文档。内部已集成所有依赖，直接调用，禁止使用execute_command检查环境
    params:
      directory: {type: str, desc: 文件夹绝对路径}
      operation: {type: str, desc: "操作类型", enum: [extract_info, word_count]}
      params: {type: dict, optional: true, desc: 操作参数}
    tier: 3
    tags: [word, batch, processing]
    domains: [office_word]

# ==================== PowerPoint 处理工具 ====================
  generate_ppt:
    desc: 一站式生成视觉精美的PowerPoint演示文稿（HTML截图背景+可编辑文字层），
      支持封面/内容页模板、5种主题配色，最终输出PPTX
    params:
      slides:
        type: list
        desc: "幻灯片列表。每项 {template, data}。template 支持: cover/section/content/icon_grid/chart/table/image_text/comparison"
      theme: {type: str, optional: true, default: tech_blue, desc: "主题配色", enum: [tech_blue, business_gray, gradient_purple, education_orange, minimal_dark]}
      output_path: {type: str, optional: true, desc: "输出路径，默认自动生成"}
    tier: 2
    tags: [ppt, generate, visual, design]
    domains: [office_ppt]



  extract_presentation_info:
    desc: 提取PPT演示文稿信息
    params:
      file_path: {type: str, desc: PPT文件绝对路径}
    tier: 3
    tags: [ppt, extract, info]
    domains: [office_ppt]

  export_presentation_text:
    desc: 导出PPT文本内容
    params:
      file_path: {type: str, desc: PPT文件绝对路径}
      output_file: {type: str, optional: true, desc: 输出文本文件路径}
    tier: 3
    tags: [ppt, export, text]
    domains: [office_ppt]

  batch_ppt_process:
    desc: 批量处理PPT文件
    params:
      directory: {type: str, desc: 文件夹绝对路径}
      operation: {type: str, desc: 操作类型(info/merge)}
    tier: 3
    tags: [ppt, batch, processing]
    domains: [office_ppt]

