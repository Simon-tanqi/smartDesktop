
<!-- Office文档处理拖放区域 -->
<div id="officeDropZone" class="drop-zone" style="
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border: 3px dashed #4CAF50;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin: 20px 0;
    cursor: pointer;
    transition: all 0.3s ease;
">
    <div style="font-size: 48px; margin-bottom: 15px;">📄</div>
    <h3 style="color: #333; margin: 0 0 10px 0;">Office文档智能处理</h3>
    <p style="color: #666; margin: 0 0 20px 0;">拖放Excel、Word、PPT文件到此处，我将为您：</p>
    
    <div style="display: flex; justify-content: space-around; margin: 20px 0; font-size: 14px;">
        <div>📊 Excel分析图表</div>
        <div>📝 Word内容提取</div>
        <div>🎯 PPT内容总结</div>
    </div>
    
    <div id="dropZoneText" style="color: #4CAF50; font-weight: bold;">
        拖放文件到此处或点击选择文件
    </div>
    
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.docx,.doc,.pptx,.ppt,.txt" 
           style="display: none;">
</div>

<!-- 文件处理结果展示 -->
<div id="processingResults" style="
    display: none;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
">
    <h4 style="margin: 0 0 15px 0; color: #495057;">处理结果</h4>
    <div id="resultsContent"></div>
</div>
